name: Phase 8 proof

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select infrastructure self-test or the complete TB-001 coverage run.
        required: true
        type: choice
        options:
          - harness_self_test
          - tb001

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  proof:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Erlang and Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Restore dependency and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: phase8-proof-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - name: Fetch dependencies
        run: mix deps.get
      - name: Provision isolated TEST role and database
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "TEST_DATABASE_PASSWORD=${password}" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres <<SQL
          CREATE ROLE new_you_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${password}';
          CREATE DATABASE new_you_test OWNER new_you_test;
          SQL
      - name: Run selected proof mode
        env:
          PROOF_MODE: ${{ inputs.mode }}
          TEST_DATABASE_HOST: "127.0.0.1"
          TEST_DATABASE_PORT: "55433"
          TEST_DATABASE_USERNAME: new_you_test
          TEST_DATABASE_NAME: new_you_test
        shell: bash
        run: |
          set -euo pipefail
          result_path="${RUNNER_TEMP}/phase8-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          echo "PROOF_RESULT_PATH=${result_path}" >> "$GITHUB_ENV"
          mix run test/proof/run.exs --mode "$PROOF_MODE" --output "$result_path"
      - name: Upload proof result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-proof-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_RESULT_PATH }}
          if-no-files-found: warn
