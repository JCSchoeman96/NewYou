name: Pass 9 full-suite diagnostic
on:
  push:
    branches: [prejit/analytics-pass9-final]
permissions:
  contents: read
jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ci: capture Pass 9 full-suite failures' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply identical bounded repair layers
        run: |
          set -euo pipefail
          python tools/pass9_repair_tmp.py
          python tools/pass9_repair_delta_tmp.py
          python tools/pass9_repair_delta2_tmp.py
          python tools/pass9_final_patch_tmp.py
          rm -f \
            tools/pass9_repair_tmp.py \
            tools/pass9_repair_delta_tmp.py \
            tools/pass9_repair_delta2_tmp.py \
            tools/pass9_final_patch_tmp.py \
            .github/workflows/pass9-v5.yml \
            .github/workflows/pass9-v5-diag.yml \
            .github/workflows/pass9-v6.yml \
            .github/workflows/pass9-v7.yml \
            .github/workflows/pass9-final.yml \
            .github/workflows/pass9-full-diag.yml
      - name: Run full suite and capture log
        continue-on-error: true
        run: python -m unittest discover -s tests -v > /tmp/full.log 2>&1
      - name: Build compact failure report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/full.log').read_text(errors='replace').splitlines() if Path('/tmp/full.log').exists() else ['full log missing']
          out=[]
          for i,line in enumerate(lines):
              if line.startswith(('FAIL:','ERROR:')):
                  out.extend(lines[i:min(len(lines),i+40)])
                  out.append('---')
          out.append('=== SUMMARY ===')
          out.extend(lines[-30:])
          Path('/tmp/pass9-full-failures.txt').write_text('\n'.join(out)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass9-full-failures
          path: /tmp/pass9-full-failures.txt
          retention-days: 1
