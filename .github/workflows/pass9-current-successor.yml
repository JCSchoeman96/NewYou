name: Pass 9 current-successor exact verification

on:
  push:
    branches: [prejit/analytics-pass9-final]

permissions:
  contents: write

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'ci: run Pass 9 current-successor verification' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply deterministic Pass 9 repair chain
        run: |
          python tools/pass9_repair_tmp.py
          python tools/pass9_repair_delta_tmp.py
          python tools/pass9_repair_delta2_tmp.py
          python tools/pass9_final_patch_tmp.py
          python tools/pass9_current_successor_delta_tmp.py

      - name: Remove temporary Pass 9 machinery before verification
        run: |
          rm -f tools/pass9_repair_tmp.py \
                tools/pass9_repair_delta_tmp.py \
                tools/pass9_repair_delta2_tmp.py \
                tools/pass9_final_patch_tmp.py \
                tools/pass9_current_successor_delta_tmp.py
          rm -f .github/workflows/pass9-v5.yml \
                .github/workflows/pass9-v5-diag.yml \
                .github/workflows/pass9-v6.yml \
                .github/workflows/pass9-v7.yml \
                .github/workflows/pass9-final.yml \
                .github/workflows/pass9-full-diag.yml \
                .github/workflows/pass9-current-successor.yml
          test -z "$(find tools .github/workflows -maxdepth 1 -type f -name 'pass9-*' -print)"

      - name: Targeted promotion-integrity regression suite
        run: >-
          python -m unittest -v
          tests.test_roadmap_routing_resilience
          tests.test_roadmap_amendment
          tests.test_authority_routing_successors
          tests.test_atlas_reconciliation
          tests.test_atlas_authority_boundary
          tests.test_product_law_hardening
          tests.test_dol_01_marketing_unsubscribe_authority
          tests.test_harden_02_contract
          tests.test_harden_02_execution
          tests.test_harden_02_completion_lifecycle
          tests.test_engineering_standards_promotion
          tests.test_engineering_standards_certification
          tests.test_foundation_integrity_audit

      - name: Full unit suite
        run: python -m unittest discover -s tests -v

      - name: Foundation Integrity
        run: python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json

      - name: Confirm bounded changed-path surface
        run: |
          git status --short
          test ! -e tools/pass9_repair_tmp.py
          test ! -e .github/workflows/pass9-current-successor.yml

      - name: Commit exact green candidate
        run: |
          git config user.name 'Pass 9 verification automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: repair current-successor integrity routing'
          git push origin HEAD:prejit/analytics-pass9-final
