name: Pass 9 verify analytics roadmap promotion

on:
  push:
    branches: [prejit/analytics-pass9-verify]

permissions:
  contents: write

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'ci: stage Pass 9 promotion integrity candidate' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build candidate and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          ROOT = Path('docs/00_platform')
          MAIN = '086ade7b28c000de1c387acb9760e5eb08bb0413'
          ROADMAP_SHA = 'bfd0d99818d68ba3826015eed17da76424fb7d3b8148e8f686f7964915b23261'
          OPEN_OLD_SHA = 'a3aaada01b6917903d5b9a7fd1236d253a0906c45c5cd06498fa6b91182b721f'

          def one(text, old, new, label):
              n=text.count(old); assert n==1,(label,n,old); return text.replace(old,new,1)

          roadmap=ROOT/'05_ROADMAP_v1.3.0.md'
          assert subprocess.check_output(['git','hash-object',str(roadmap)],text=True).strip()=='ddff1c2fa34b3b9185bef8eb72e49f8513479887'
          assert hashlib.sha256(roadmap.read_bytes()).hexdigest()==ROADMAP_SHA
          assert (ROOT/'archive/05_ROADMAP_v1.2.0.md').is_file()

          # Open Work successor.
          old=ROOT/'02_OPEN_WORK_v1.2.59.md'; arc=ROOT/'archive/02_OPEN_WORK_v1.2.59.md'
          b=old.read_bytes(); assert hashlib.sha256(b).hexdigest()==OPEN_OLD_SHA and not arc.exists(); arc.write_bytes(b); old.unlink()
          lines=b.decode().splitlines()
          def line(prefix,value):
              hits=[i for i,x in enumerate(lines) if x.startswith(prefix)]; assert len(hits)==1,(prefix,hits); lines[hits[0]]=value
          assert lines[0]=='# 02_OPEN_WORK_v1.2.59.md'; lines[0]='# 02_OPEN_WORK_v1.2.60.md'
          line('- **Document status:**','- **Document status:** PRODUCT LAW AND GOVERNANCE OPEN-WORK SUCCESSOR v1.2.60')
          line('- **Document version:**','- **Document version:** v1.2.60')
          line('- **Predecessor:**','- **Predecessor:** `archive/02_OPEN_WORK_v1.2.59.md` (preserved byte-identically)')
          line('- **Planning-state SemVer transition:**','- **Planning-state SemVer transition:** `v1.2.59 → v1.2.60` — Roadmap v1.3.0 bounded FP-006 Research & Feedback activation plus routing-only Atlas/HARDEN successor alignment.')
          line('- **Patch scope:**','- **Patch scope:** Routes accepted Roadmap v1.3.0 as current Roadmap authority and records the bounded FP-006 Research & Feedback activation required for the Product-Law controlled-pilot value/relevance/price-value instrument. Also routes the non-authoritative Atlas v0.4.2 and HARDEN-02 v0.5.4 routing-only successors. This successor does not advance FP-001, Phase 7C, proof classification, Phase 8 or implementation; current FP-001 conditional-dossier status remains unchanged.')
          line('- **Last updated:**','- **Last updated:** 2026-10-10')
          marker='## Historical changelog'; hi=lines.index(marker); prefix='\n'.join(lines[:hi])
          prefix=prefix.replace('05_ROADMAP_v1.2.0.md','05_ROADMAP_v1.3.0.md').replace('working/DELIVERY_ATLAS_WORKING_v0.4.1.md','working/DELIVERY_ATLAS_WORKING_v0.4.2.md').replace('working/HARDEN-02_CONTRACT_WORKING_v0.5.3.md','working/HARDEN-02_CONTRACT_WORKING_v0.5.4.md')
          phrase='Current Product, Decision, Domain and Roadmap authorities remain v1.6.0, v1.6.0, v1.2.0 and v1.2.0;'; assert prefix.count(phrase)==1
          prefix=prefix.replace(phrase,'Current Product, Decision, Domain and Roadmap authorities are v1.6.0, v1.6.0, v1.2.0 and v1.3.0; Roadmap v1.3.0 resolves the bounded FP-006 Research & Feedback sequencing gap only; it does not change current FP-001 dossier requirements or the current Analytics NOT REQUIRED status for FP-001.',1)
          lines[:hi]=prefix.splitlines(); hi=lines.index(marker)
          section=['## 12.17 — Roadmap v1.3.0 bounded FP-006 Research & Feedback activation','', 'Roadmap `05_ROADMAP_v1.3.0.md` is the semantic successor to v1.2.0 for one bounded sequencing correction: the Product-Law-required FP-006 controlled-pilot value/relevance/price-value feedback instrument now explicitly activates `Research & Feedback` as the owner of governed instrument/question version and participant-submitted response truth. `Analytics` remains downstream measurement authority. FP-005 basic progress/usefulness feedback remains `Habits, Journals & Progress` truth where that purpose fits, and broader Research capability remains future-gated / Feature-Pack-unassigned.','', 'This status successor changes no Product Law, Decision Register, Domain Law or Architecture semantics; creates no Research Feature Pack or new OQ; does not activate Voting & Balloting or FP-016 experimentation; and does not select participation identity mode, retention/deletion rules, provider, Resource/schema/event design or proof classification. Normal FP-006 Phase 7 gate-manifest/JIT adjudication must determine the minimum applicable Research, Privacy, retention/deletion, proof and operational obligations before the bounded instrument can be implemented.','', 'The active FP-001 programme is unchanged. Analytics remains `NOT REQUIRED` for the current FP-001 conditional-dossier programme, Communications finalisation remains `BLOCKED / STOP`, conditional dossiers retain their existing adjudication state, Phase 7C remains `BLOCKED / NOT_STARTED`, proof classification remains `NOT FINALISED`, and Phase 8/application implementation remain unauthorised.','', '---','']
          lines[hi:hi]=section; ow=ROOT/'02_OPEN_WORK_v1.2.60.md'; ow.write_text('\n'.join(lines)+'\n'); owsha=hashlib.sha256(ow.read_bytes()).hexdigest()

          # Atlas routing-only successor.
          ao=ROOT/'working/DELIVERY_ATLAS_WORKING_v0.4.1.md'; aa=ROOT/'archive/DELIVERY_ATLAS_WORKING_v0.4.1.md'; at=ao.read_text(); aa.write_bytes(ao.read_bytes()); ao.unlink()
          at=one(at,'# Delivery Atlas working v0.4.1','# Delivery Atlas working v0.4.2','atlas title')
          at=one(at,'- **Predecessor:** `archive/DELIVERY_ATLAS_WORKING_v0.4.0.md` (routing predecessor; preserved byte-identically). Earlier predecessors remain preserved at their archive paths.','- **Predecessor:** `archive/DELIVERY_ATLAS_WORKING_v0.4.1.md` (routing predecessor; preserved byte-identically). Earlier predecessors remain preserved at their archive paths.','atlas pred')
          at=one(at,'- **SemVer transition:** `v0.4.0 → v0.4.1` (PATCH: current Open Work and Communications task-status routing only; Atlas authority and delivery content are unchanged).','- **SemVer transition:** `v0.4.1 → v0.4.2` (PATCH: current Roadmap/Open Work routing only; Atlas authority and derived semantic inventory are unchanged).','atlas semver')
          oldstate=next(x for x in at.splitlines() if x.startswith('- **Current content state:**'))
          at=one(at,oldstate,'- **Current content state:** ATLAS-01 through ATLAS-11 remain complete at their recorded source-at-freeze scope as derived navigation. This `v0.4.2` successor routes current authority to Roadmap v1.3.0 and Open Work v1.2.60 only. It does not semantically re-derive capability/domain/Feature-Pack views. Where an older Atlas view differs from the bounded FP-006 Research & Feedback activation in Roadmap v1.3.0, the current Roadmap wins. FP-001 status and all later gates remain unchanged.','atlas state')
          at=one(at,'- **Patch scope:** PATCH / current-source routing only; Atlas authority and delivery content are unchanged.','- **Patch scope:** PATCH / current Roadmap/Open Work routing only; Atlas authority and derived semantic inventory are unchanged.','atlas scope')
          ins='## v0.4.2 Patch Scope\n\nThis routing-only successor aligns current-source navigation to `05_ROADMAP_v1.3.0.md` and `02_OPEN_WORK_v1.2.60.md`. It does not re-derive ATLAS-01…ATLAS-11 semantic views. The bounded FP-006 Research & Feedback activation is current Roadmap authority; any older Atlas capability/domain row is subordinate source-at-freeze navigation until a separately governed Atlas semantic reconciliation is justified. No Feature Pack, Domain, gate, proof class or implementation permission is created or changed here.\n\n'
          at=one(at,'## v0.4.1 Patch Scope',ins+'## v0.4.1 Patch Scope','atlas insertion')
          s=at.index('The current sources that establish this chain are:'); e=at.index('Historical source-at-freeze filenames',s); block=at[s:e].replace('05_ROADMAP_v1.2.0.md','05_ROADMAP_v1.3.0.md').replace('02_OPEN_WORK_v1.2.59.md','02_OPEN_WORK_v1.2.60.md'); at=at[:s]+block+at[e:]
          an=ROOT/'working/DELIVERY_ATLAS_WORKING_v0.4.2.md'; an.write_text(at)

          # HARDEN routing-only successor.
          ho=ROOT/'working/HARDEN-02_CONTRACT_WORKING_v0.5.3.md'; ha=ROOT/'archive/HARDEN-02_CONTRACT_WORKING_v0.5.3.md'; ht=ho.read_text(); ha.write_bytes(ho.read_bytes()); ho.unlink()
          ht=one(ht,'# HARDEN-02_CONTRACT_WORKING_v0.5.3.md','# HARDEN-02_CONTRACT_WORKING_v0.5.4.md','h title'); ht=one(ht,'- **Plan / contract version:** `v0.5.3`','- **Plan / contract version:** `v0.5.4`','h version'); ht=one(ht,'- **Current predecessor:** `archive/HARDEN-02_CONTRACT_WORKING_v0.5.2.md` — byte-identical prior current-status snapshot','- **Current predecessor:** `archive/HARDEN-02_CONTRACT_WORKING_v0.5.3.md` — byte-identical prior current-status snapshot','h pred')
          mk='- **v0.5.3 status-successor base main SHA:** `a062bd56e3ae94e815e2991ee00bf133ee9f3b56`'; assert ht.count(mk)==1; ht=ht.replace(mk,mk+f'\n- **v0.5.4 status-successor base main SHA:** `{MAIN}`',1)
          anchor='\n---\n\n## 1. Objective'; assert ht.count(anchor)==1; rev=f'\n- v0.5.4 — PATCH current-source routing successor from main `{MAIN}`. Aligns current Roadmap/Open Work/Atlas routes to Roadmap v1.3.0, Open Work v1.2.60 and Atlas v0.4.2. The certified v0.4.0 HARDEN-02 semantics, execution/certification evidence, FP-001 status, conditional-dossier dispositions and all later gates are unchanged.\n'; ht=ht.replace(anchor,rev+anchor,1)
          s=ht.index('### CURRENT AUTHORITY'); e=ht.index('### CURRENT DERIVED EVIDENCE',s); block=ht[s:e].replace('02_OPEN_WORK_v1.2.59.md','02_OPEN_WORK_v1.2.60.md').replace('05_ROADMAP_v1.2.0.md','05_ROADMAP_v1.3.0.md'); ht=ht[:s]+block+ht[e:]
          s=ht.index('### CURRENT DERIVED EVIDENCE'); e=ht.index('### HISTORICAL AUTHORITY / WORKING EVIDENCE',s); block=ht[s:e].replace('working/DELIVERY_ATLAS_WORKING_v0.4.1.md','working/DELIVERY_ATLAS_WORKING_v0.4.2.md'); ht=ht[:s]+block+ht[e:]
          ht=ht.replace('"status_successor_version": "0.5.3"','"status_successor_version": "0.5.4"',1).replace('"status_successor_base_sha": "a062bd56e3ae94e815e2991ee00bf133ee9f3b56"',f'"status_successor_base_sha": "{MAIN}"',1)
          hn=ROOT/'working/HARDEN-02_CONTRACT_WORKING_v0.5.4.md'; hn.write_text(ht)

          # README current routing.
          rp=ROOT/'README.md'; r=rp.read_text()
          pairs=[('4. `02_OPEN_WORK_v1.2.59.md`','4. `02_OPEN_WORK_v1.2.60.md`'),('7. `05_ROADMAP_v1.2.0.md`','7. `05_ROADMAP_v1.3.0.md`'),('`working/DELIVERY_ATLAS_WORKING_v0.4.1.md` — derived Delivery Atlas navigation with current-source routing for approved Feature Pack planning. It remains working/non-authoritative, outside authority-document records, and is listed only under graph/navigation paths. Its active Open Work route is v1.2.59; direct predecessor v0.4.0 is preserved byte-identically at `archive/DELIVERY_ATLAS_WORKING_v0.4.0.md`. The unchanged v0.2.1 working path remains available to existing FP-001 and HARDEN-02 source-at-freeze references.','`working/DELIVERY_ATLAS_WORKING_v0.4.2.md` — routing-only derived Delivery Atlas successor aligned to Roadmap v1.3.0 and Open Work v1.2.60. It remains working/non-authoritative and does not semantically re-derive prior Atlas views; current Roadmap authority wins. Direct predecessor v0.4.1 is preserved byte-identically at `archive/DELIVERY_ATLAS_WORKING_v0.4.1.md`.'),('`working/HARDEN-02_CONTRACT_WORKING_v0.5.3.md` — preserves certified HARDEN-02 execution evidence and records Engineering Standards Authority Promotion, FP-001 PMR reconciliation, Identity v0.1.4 promotion and Communications dossier v0.1.0 promotion COMPLETE / CERTIFIED. Communications finalisation remains BLOCKED / STOP. Later gates remain downstream or blocked. Direct predecessor v0.5.2 is preserved byte-identically at `archive/HARDEN-02_CONTRACT_WORKING_v0.5.2.md`.','`working/HARDEN-02_CONTRACT_WORKING_v0.5.4.md` — routing-only status successor aligned to Roadmap v1.3.0, Open Work v1.2.60 and Atlas v0.4.2. Certified HARDEN-02 evidence and all FP-001/later-gate states are unchanged. Direct predecessor v0.5.3 is preserved byte-identically at `archive/HARDEN-02_CONTRACT_WORKING_v0.5.3.md`.'),('[Delivery Atlas](working/DELIVERY_ATLAS_WORKING_v0.4.1.md)','[Delivery Atlas](working/DELIVERY_ATLAS_WORKING_v0.4.2.md)'),('Current programme status is in Open Work v1.2.59.','Current programme status is in Open Work v1.2.60.')]
          for a,b2 in pairs: r=one(r,a,b2,'README')
          ar='## Archive\n\n'; r=one(r,ar,ar+'- `archive/02_OPEN_WORK_v1.2.59.md` — byte-identical direct predecessor to current Open Work v1.2.60; its hash is pinned in the manifest.\n- `archive/DELIVERY_ATLAS_WORKING_v0.4.1.md` — byte-identical direct predecessor to current Atlas v0.4.2.\n- `archive/HARDEN-02_CONTRACT_WORKING_v0.5.3.md` — byte-identical direct predecessor to current HARDEN-02 v0.5.4.\n','README archive')
          rp.write_text(r)

          # Manifest.
          mp=ROOT/'CURRENT_AUTHORITY_MANIFEST_v1.0.0.json'; m=json.loads(mp.read_text()); gov={x['document_id']:x for x in m['governing_documents']}; assert gov['OPEN_WORK']['semver']=='1.2.59' and gov['ROADMAP']['semver']=='1.2.0'
          gov['OPEN_WORK'].update(canonical_filename='02_OPEN_WORK_v1.2.60.md',semver='1.2.60',repository_path='docs/00_platform/02_OPEN_WORK_v1.2.60.md',sha256=owsha,superseded_version='1.2.59',lifecycle='current')
          gov['ROADMAP'].update(canonical_filename='05_ROADMAP_v1.3.0.md',semver='1.3.0',repository_path='docs/00_platform/05_ROADMAP_v1.3.0.md',sha256=ROADMAP_SHA,superseded_version='1.2.0',lifecycle='current',graph_policy='frozen_provenance',provenance_sha256=ROADMAP_SHA)
          m['historical_documents'][0:0]=[{'document_id':'OPEN_WORK_V1_2_59','canonical_filename':'02_OPEN_WORK_v1.2.59.md','semver':'1.2.59','repository_path':'docs/00_platform/archive/02_OPEN_WORK_v1.2.59.md','authority_class':'PLANNING_TRACKER_HISTORICAL','sha256':OPEN_OLD_SHA,'superseded_version':'1.2.60','lifecycle':'historical','provenance_sha256':OPEN_OLD_SHA},{'document_id':'ROADMAP_V1_2_0','canonical_filename':'05_ROADMAP_v1.2.0.md','semver':'1.2.0','repository_path':'docs/00_platform/archive/05_ROADMAP_v1.2.0.md','authority_class':'ROADMAP_HISTORICAL','sha256':'601172754e78f23df7d6b59e7c4eceb0aefa0b9e5bb65045dafeacd78b9d0fb0','superseded_version':'1.3.0','lifecycle':'historical','graph_policy':'frozen_provenance','provenance_sha256':'601172754e78f23df7d6b59e7c4eceb0aefa0b9e5bb65045dafeacd78b9d0fb0'}]
          nav=m['integrity_rules']['graph_rules']['navigation_document_paths']; nav[nav.index('docs/00_platform/working/DELIVERY_ATLAS_WORKING_v0.4.1.md')]='docs/00_platform/working/DELIVERY_ATLAS_WORKING_v0.4.2.md'; nav[nav.index('docs/00_platform/working/HARDEN-02_CONTRACT_WORKING_v0.5.3.md')]='docs/00_platform/working/HARDEN-02_CONTRACT_WORKING_v0.5.4.md'; mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')

          # Current-route tooling/test fixtures. Historical failures will identify over-broad substitutions.
          repl=[('02_OPEN_WORK_v1.2.59.md','02_OPEN_WORK_v1.2.60.md'),('05_ROADMAP_v1.2.0.md','05_ROADMAP_v1.3.0.md'),('working/DELIVERY_ATLAS_WORKING_v0.4.1.md','working/DELIVERY_ATLAS_WORKING_v0.4.2.md'),('DELIVERY_ATLAS_WORKING_v0.4.1.md','DELIVERY_ATLAS_WORKING_v0.4.2.md'),('working/HARDEN-02_CONTRACT_WORKING_v0.5.3.md','working/HARDEN-02_CONTRACT_WORKING_v0.5.4.md'),('HARDEN-02_CONTRACT_WORKING_v0.5.3.md','HARDEN-02_CONTRACT_WORKING_v0.5.4.md')]
          for p in [Path('tools/foundation_integrity_audit.py'),*Path('tests').glob('test_*.py')]:
              s=p.read_text()
              for a,b2 in repl:s=s.replace(a,b2)
              p.write_text(s)
          tp=Path('tools/foundation_integrity_audit.py'); t=tp.read_text(); t=t.replace('("0.4.7", "0.4.8", "0.4.9", "0.5.0", "0.5.1", "0.5.2", "0.5.3")','("0.4.7", "0.4.8", "0.4.9", "0.5.0", "0.5.1", "0.5.2", "0.5.3", "0.5.4")').replace('expected_harden_version = "0.5.3" if promotion_status == "COMPLETE / CERTIFIED" else "0.4.7"','expected_harden_version = "0.5.4" if promotion_status == "COMPLETE / CERTIFIED" else "0.4.7"')
          needle='expected_base_sha = (\n            "a062bd56e3ae94e815e2991ee00bf133ee9f3b56"\n            if state.get("status_successor_version") == "0.5.3"'; assert needle in t; t=t.replace(needle,'expected_base_sha = (\n            "'+MAIN+'"\n            if state.get("status_successor_version") == "0.5.4"\n            else "a062bd56e3ae94e815e2991ee00bf133ee9f3b56"\n            if state.get("status_successor_version") == "0.5.3"',1); tp.write_text(t)
          print('ROADMAP_SHA256',ROADMAP_SHA); print('OPEN_WORK_SHA256',owsha); print('ATLAS_SHA256',hashlib.sha256(an.read_bytes()).hexdigest()); print('HARDEN_SHA256',hashlib.sha256(hn.read_bytes()).hexdigest())
          PY
          echo '=== UNIT TESTS ==='
          python -m unittest discover -s tests -v
          echo '=== FOUNDATION INTEGRITY ==='
          python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
          rm .github/workflows/pass9-verify.yml
          git config user.name 'Pass 9 verification automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: assemble verified Roadmap v1.3.0 promotion package'
          git push origin HEAD:prejit/analytics-pass9-verify
