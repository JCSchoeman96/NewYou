name: Nightly hardening

# Only main receives scheduled or manual hardening. No push/PR triggers and no
# cache restore: Foundation Full and the deep gate start on fresh runners.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  foundation-full:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/foundation-full.yml
    with:
      sha: ${{ github.sha }}

  mix-check-deep:
    name: Nightly mix check.deep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Erlang and Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Fetch dependencies
        run: mix deps.get
      - name: Provision isolated TEST role and database
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "TEST_DATABASE_PASSWORD=${password}" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres <<SQL
          CREATE ROLE new_you_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${password}';
          CREATE DATABASE new_you_test OWNER new_you_test;
          SQL
      - name: Run slower engineering gate
        env:
          TEST_DATABASE_HOST: "127.0.0.1"
          TEST_DATABASE_PORT: "55433"
          TEST_DATABASE_USERNAME: new_you_test
          TEST_DATABASE_NAME: new_you_test
        run: mix check.deep
