name: Foundation Full

# Historical/provenance governance certification. This workflow is physically
# separate from the required merge gate and intentionally keeps using the
# frozen pre-WELL-66 CURRENT_AUTHORITY_MANIFEST_v1.0.0.json baseline.
#
# Foundation Integrity starts it automatically as non-blocking evidence for
# durable-governance/provenance/workflow PRs; Nightly hardening calls it on
# main; workflow_dispatch provides deliberate exact-SHA certification.
# Current delivery-state routing belongs to Plane and Foundation Smoke's lean
# CURRENT_AUTHORITY_ROUTER_v1.0.0.json instead.
#
# Every invocation starts cold, without dependency or build caches.

on:
  workflow_call:
    inputs:
      sha:
        description: Exact commit SHA to check out when a caller supplies one; empty uses the caller SHA.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA to certify.
        required: true
        type: string

permissions:
  contents: read

jobs:
  foundation-full:
    name: Foundation Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact-SHA dispatch checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          expected="$EXPECTED_SHA"
          if ! [[ "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a 40-character commit SHA; got: $expected"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Checked out ${actual} but requested ${expected}"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run full historical governance and provenance unit tests
        run: python -m unittest discover -s tests -v
      - name: Run frozen manifest-backed historical foundation audit
        run: python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
