name: Self-hosted CI Pilot

on:
  pull_request:
    paths:
      - ".github/workflows/self-hosted-ci-pilot.yml"

permissions:
  contents: read

jobs:
  foundation-integrity-pilot:
    runs-on: [self-hosted, linux, x64, ci-kvm]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run manifest-backed foundation audit
        run: python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
