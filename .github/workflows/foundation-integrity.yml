name: Foundation Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to check out and validate (40-character git object id).
        required: true
        type: string

permissions:
  contents: read

jobs:
  foundation-integrity:
    name: Foundation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: Verify exact-head checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          expected="$EXPECTED_REF"
          if ! [[ "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a 40-character commit SHA; got: $expected"
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "$expected" ]]; then
            echo "GITHUB_SHA ${GITHUB_SHA} does not match ref input ${expected}"
            echo "Use workflow from the branch whose tip is the certified SHA."
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Checked out ${actual} but ref input was ${expected}"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run manifest-backed foundation audit
        run: python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
