name: Foundation Integrity

on:
  pull_request:
    paths:
      - ".github/workflows/foundation-integrity.yml"
      - "docs/00_platform/**"
      - "tools/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/foundation-integrity.yml"
      - "docs/00_platform/**"
      - "tools/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  foundation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run manifest-backed foundation audit
        run: python tools/foundation_integrity_audit.py --manifest docs/00_platform/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
