name: Pass 9 materialize candidate
on:
  push:
    branches: [prejit/analytics-pass9-verify]
permissions:
  contents: write
jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'ci: materialize Pass 9 candidate for surgical repair' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build generated package, restore code baseline, commit only candidate docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/pass9-verify.yml').read_text(); script=text.split('        run: |\n',1)[1]; lines=[]
          for line in script.splitlines():
            if line.startswith('          '): lines.append(line[10:])
            elif not line.strip(): lines.append('')
            else: break
          script='\n'.join(lines); Path('/tmp/build.sh').write_text(script[:script.index("echo '=== UNIT TESTS ==='")])
          PY
          bash /tmp/build.sh
          git checkout 6231403d807e97397137a8b0e157339be21863c1 -- tests tools/foundation_integrity_audit.py
          rm -f .github/workflows/pass9-*.yml
          git config user.name 'Pass 9 verification automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: materialize Roadmap v1.3.0 promotion candidate'
          git push origin HEAD:prejit/analytics-pass9-verify
