name: Pass 9 roadmap regression diagnostic
on:
  push:
    branches: [prejit/analytics-pass9-verify]
permissions:
  contents: read
jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'ci: isolate Pass 9 Roadmap regression failures' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild exact candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/pass9-verify.yml').read_text(); script=text.split('        run: |\n',1)[1]; lines=[]
          for line in script.splitlines():
            if line.startswith('          '): lines.append(line[10:])
            elif not line.strip(): lines.append('')
            else: break
          script='\n'.join(lines); Path('/tmp/build.sh').write_text(script[:script.index("echo '=== UNIT TESTS ==='")])
          PY
          bash /tmp/build.sh
      - name: Roadmap regression tests
        continue-on-error: true
        run: python -m unittest -v tests.test_roadmap_routing_resilience > /tmp/roadmap.log 2>&1
      - name: Compact report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('/tmp/roadmap.log').read_text(errors='replace').splitlines(); out=[]
          for i,l in enumerate(a):
            if l.startswith(('FAIL:','ERROR:')): out += a[max(0,i-2):min(len(a),i+30)] + ['---']
          out += a[-12:]
          Path('/tmp/pass9-roadmap.txt').write_text('\n'.join(out)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass9-roadmap-failures
          path: /tmp/pass9-roadmap.txt
          retention-days: 1
